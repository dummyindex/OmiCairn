# Orchestration config for the single-hypothesis CONTROL arm.
# Mirrors synth-dynamic-h EXACTLY except allow_on_the_fly_hypotheses,
# so any difference in the resulting knowledge graph is attributable to
# the dynamic-hypothesis mechanism alone (a clean A/B).
budgets:
  max_phase_wall_minutes: 10
  max_total_wall_minutes: 120
  allow_web: false
  claude_model: claude-sonnet-4-6
  max_phase_budget_usd: 2.0
bounds:
  max_iters_per_phase: 3
  max_backtracks: 3
# The lever under test: OFF here, ON in synth-dynamic-h.
allow_on_the_fly_hypotheses: false
auto_approve: true
